name: Computer Use Linux
on:
  push:
    branches-ignore: [main]
    paths:
      - 'packages/plugin-computer-control/**'
      - '.github/workflows/computer-use-linux.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    name: Helper and real desktop tests (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the libraries and the headless desktop
        run: sudo packages/plugin-computer-control/native/linux/deps.sh --test
      - name: Build the plugin (the helper's manifest writer)
        run: pnpm --filter @moxxy/plugin-computer-control... build
      - name: Build the helper and run its unit tests
        run: packages/plugin-computer-control/native/linux/build.sh
      - name: Drive the real helper against the fixture app on an X11 desktop
        working-directory: packages/plugin-computer-control
        run: native/linux/desktop.sh npx vitest run src/linux
      - name: Upload the helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moxxy-computer-linux-${{ matrix.arch }}
          path: packages/plugin-computer-control/bin/linux-${{ matrix.arch }}/
          if-no-files-found: error

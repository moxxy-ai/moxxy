name: CI

# Branch model: `development` is the integration branch — every feature PR
# targets it and must be green here. `main` is the production branch,
# MACHINE-ADVANCED by `release.yml` (a `git commit-tree` copy of development),
# never via a human PR.
#
# Triggers: `pull_request` covers feature PRs (→ development). `push` covers
# `main`, but release commits are `Release: v… [skip ci]`, so post-release pushes
# self-skip — this trigger only fires if `main` is ever pushed some other way.
# `development` is intentionally NOT in `push`: direct pushes to it are the
# release workflow's `[skip ci]` bot commits (the version bump + any tombstone
# bumps), and feature work arrives via `pull_request` runs. The changeset gate
# applies only to feature PRs (→ development).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every PR must add a changeset — it is the switch that drives version bumps,
  # the npm publish (@moxxy/cli + @moxxy/sdk), AND the desktop installer release
  # (@moxxy/desktop rides changesets too). A PR without one ships nothing. For a
  # change that genuinely releases nothing (docs / CI / tests), record that on
  # purpose with an EMPTY changeset: `pnpm changeset --empty`.
  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    # Only PRs have a base branch to diff against, and only FEATURE PRs (those
    # targeting `development`) must add one. `main` is machine-advanced by the
    # release workflow (no PR), so nothing else reaches this gate.
    if: github.event_name == 'pull_request' && github.base_ref == 'development'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Need history back to the merge-base so the diff below resolves.
          fetch-depth: 0
      - name: Require a changeset
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Real changeset markdown added/modified in this PR (exclude the
          # template README and the non-markdown config). `|| true` so a
          # no-match grep under `set -eo pipefail` doesn't abort before the
          # friendly error below.
          added="$( { git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- '.changeset/' \
            | grep -E '\.md$' | grep -vE '(^|/)README\.md$'; } || true )"
          if [ -z "$added" ]; then
            echo "::error::No changeset in this PR. Run 'pnpm changeset' (or 'pnpm changeset --empty' for a no-release change) and commit the file under .changeset/."
            exit 1
          fi
          echo "Changeset(s) found in this PR:"
          printf '%s\n' "$added"

  build-and-test:
    name: Build + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover the declared engines floor (>=20.10), current LTS, and latest.
        node: ['20.x', '22.x', '24.x']
    env:
      MOXXY_FIXTURES: replay

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore Turborepo's local cache so unchanged packages aren't rebuilt
      # or retested across runs. The cache is content-addressed, so restoring a
      # superset is always safe — turbo only reuses entries whose hash matches.
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.node }}-

      # Use the root scripts (turbo run …) rather than `pnpm -r` so CI gets
      # turbo's graph-aware ordering AND caching — the whole repo is built
      # around it; `pnpm -r` ignored the cache entirely.
      - name: Build
        run: |
          if [ "${{ matrix.node }}" = "20.x" ]; then
            pnpm exec turbo run build --filter='!docs'
          else
            pnpm build
          fi

      - name: Typecheck
        run: |
          if [ "${{ matrix.node }}" = "20.x" ]; then
            pnpm exec turbo run typecheck --filter='!docs'
          else
            pnpm typecheck
          fi

      - name: Lint
        run: pnpm lint

      - name: Test
        # Cap turbo's package-level parallelism on the 4-vCPU runner: each
        # package's vitest already spawns per-core workers, so the default
        # fan-out oversubscribes CPU and makes timing-sensitive perf guards
        # (e.g. anonymizer's O(n²)-redaction regression test) flake. Two packages
        # at a time keeps total workers near core count without hiding regressions.
        run: pnpm exec turbo run test --concurrency=2 && pnpm run test:scripts

      - name: Dependency invariants
        # dependency-cruiser 18 is a development-only analyzer and requires
        # Node >=22.12. The Node 20 leg still verifies the shipped CLI/runtime;
        # the invariant itself is checked independently on Node 22 and 24.
        if: matrix.node != '20.x'
        run: pnpm check:deps

      - name: Smoke — CLI help loads
        run: node packages/cli/dist/bin.js --help

      - name: Smoke — plugins list (no API calls)
        run: node packages/cli/dist/bin.js plugins list

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject unmitigated advisories
        run: pnpm audit:security

      - name: Verify the locally patched parsers
        run: node --test scripts/image-size-patch.test.mjs

  dep-cruise-graph:
    name: Generate dependency graph
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render graph
        run: |
          mkdir -p .artifacts
          pnpm exec depcruise --config .dependency-cruiser.cjs --output-type dot packages \
            > .artifacts/graph.dot || true

      - name: Upload graph artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-graph
          path: .artifacts/graph.dot
          if-no-files-found: ignore

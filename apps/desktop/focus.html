<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoxxyAI · Focus</title>
    <style>
      /* Reset — transparent everywhere, fill viewport, no scrollbars.
       * The renderer's React tree paints the visible chrome (white
       * tile, rounded corners, shadow). */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: transparent;
        overflow: hidden;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI Variable Text',
          'Segoe UI',
          system-ui,
          sans-serif;
        color: #141414;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Always show a click target while the JS bundle loads. The
       * React tree replaces this on mount; if main fails to load,
       * at least the user sees something. The mark is the same cut-out
       * raster MoxxyMark paints, loaded from public/ with no network and
       * no bundle, which keeps the pre-mount and post-mount widget looking
       * like one app. */
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 12px;
        -webkit-app-region: drag;
      }
      /* Breathes like .moxxy-avatar-loader in styles.css. */
      #boot-fallback .mark {
        width: 28px;
        height: 28px;
        animation: focus-boot-breathe 2.4s ease-in-out infinite;
      }
      @keyframes focus-boot-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.92);
          opacity: 0.7;
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          color: #f5f5f5;
        }
        #boot-fallback {
          background: rgba(33, 33, 33, 0.96);
          border: 1px solid rgba(255, 255, 255, 0.14);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-fallback .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <img class="mark" src="/moxxy-mark.png" alt="moxxy" width="28" height="28" />
      </div>
    </div>
    <script type="module" src="/src/focus/focus-main.tsx"></script>
  </body>
</html>

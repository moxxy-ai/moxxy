<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoxxyAI Workspaces</title>
    <!-- No webfont link, deliberately. Moxxy runs a local agent runtime and has
         to boot with no network at all; fetching Inter and Space Grotesk from a
         CDN meant a cold offline start rendered in a silent fallback face. The
         desktop type stacks (see packages/design-tokens/src/desktop.ts) lead
         with each platform's own text face: SF Pro on macOS, Segoe UI on
         Windows. -->
  </head>
  <body>
    <style>
      html, body { margin: 0; background: #ffffff; color: #141414;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; }
      #splash-fallback { position: fixed; inset: 0; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        gap: 1.25rem; }
      /* The mark is the same cut-out raster MoxxyMark paints (public/, so it
         loads from disk with no network and no bundle), and it breathes the
         way .moxxy-avatar-loader in styles.css does, so the pre-React and
         post-React splashes look identical. */
      #splash-fallback .mark { width: 64px; height: 64px;
        animation: splash-breathe 2.4s ease-in-out infinite; }
      #splash-fallback .label { font-size: 0.7rem; color: #5e5e5e;
        letter-spacing: 0.12em; text-transform: uppercase; }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.7; }
      }
      /* Dark splash — main sets nativeTheme.themeSource from the persisted
         pref BEFORE the window is created, so this media query reflects the
         user's choice (not just the OS) by the time this CSS evaluates. The
         colors mirror styles.css's dark --color-main-bg / text tokens. */
      @media (prefers-color-scheme: dark) {
        html, body { background: #1a1a1a; color: #f5f5f5; }
        #splash-fallback .label { color: #a6a6a6; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-fallback .mark { animation: none; }
      }
    </style>
    <link rel="icon" type="image/png" href="/logo.png" />
    <div id="root">
      <div id="splash-fallback">
        <img class="mark" src="/moxxy-mark.png" alt="moxxy" width="64" height="64" />
        <div class="label">Getting things ready…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

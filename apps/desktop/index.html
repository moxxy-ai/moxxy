<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoxxyAI Workspaces</title>
    <!-- No webfont link, deliberately. Moxxy runs a local agent runtime and has
         to boot with no network at all; fetching Inter and Space Grotesk from a
         CDN meant a cold offline start rendered in a silent fallback face. The
         Harness type stacks (see packages/design-tokens) are ordered so the
         first available system face is already the intended one: SF Mono on
         macOS, Consolas on Windows, Charter or Georgia for prose. -->
  </head>
  <body>
    <style>
      html, body { margin: 0; background: #ffffff; color: #0b0f12;
        font-family: 'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
      #splash-fallback { position: fixed; inset: 0; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        gap: 1.25rem; }
      /* The mark itself, inline so the cold-start splash needs no network and
         no bundle. A quarter turn is a full loop: the mark is symmetric under
         90deg, so the animation closes on itself. Mirrors .moxxy-avatar-loader
         in styles.css so the pre-React and post-React splashes look identical. */
      #splash-fallback .mark { width: 64px; height: 64px; color: #0b0f12;
        animation: splash-turn 3.4s linear infinite; }
      #splash-fallback .label { font-size: 0.7rem; color: #4a5a64;
        letter-spacing: 0.12em; text-transform: uppercase; }
      /* The mark's second strand takes the commanded accent, which is the
         brand's Signal at a different stop per theme (deepened on paper so it
         holds against white, Signal exactly on ink) for the same reason the
         brand ships a -dark mark. */
      #splash-fallback .strand { stroke: #d62a00; }
      @keyframes splash-turn { to { transform: rotate(90deg); } }
      /* Dark splash — main sets nativeTheme.themeSource from the persisted
         pref BEFORE the window is created, so this media query reflects the
         user's choice (not just the OS) by the time this CSS evaluates. The
         colors mirror styles.css's dark --color-main-bg / text tokens. */
      @media (prefers-color-scheme: dark) {
        html, body { background: #101519; color: #e4ebef; }
        #splash-fallback .label { color: #93a2ab; }
        #splash-fallback .mark { color: #e4ebef; }
        #splash-fallback .strand { stroke: #ff4a1e; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-fallback .mark { animation: none; }
      }
    </style>
    <link rel="icon" type="image/png" href="/logo.png" />
    <div id="root">
      <div id="splash-fallback">
        <svg class="mark" viewBox="0 0 256 256" role="img" aria-label="moxxy">
          <mask id="splash-weave" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
            <rect width="256" height="256" fill="#000" />
            <circle cx="188" cy="153" r="27" fill="#fff" />
            <circle cx="103" cy="188" r="27" fill="#fff" />
            <circle cx="68" cy="103" r="27" fill="#fff" />
            <circle cx="153" cy="68" r="27" fill="#fff" />
          </mask>
          <g fill="none" stroke-width="22" stroke-linejoin="round">
            <rect x="68" y="68" width="120" height="120" rx="12" stroke="currentColor" />
            <rect class="strand" x="68" y="68" width="120" height="120" rx="12"
                  transform="rotate(45 128 128)" />
            <g mask="url(#splash-weave)">
              <rect x="68" y="68" width="120" height="120" rx="12" stroke="currentColor" />
            </g>
          </g>
        </svg>
        <div class="label">Getting things ready…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Moxxy browser trial</title>
    <style>
      html, body { margin: 0; height: 100%; font: 12px -apple-system, sans-serif; background: #111; color: #ddd; }
      #tabs { height: 28px; display: flex; gap: 4px; padding: 4px; box-sizing: border-box; }
      #tabs button { background: #222; color: #ccc; border: 0; border-radius: 4px; max-width: 220px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      #tabs button[data-active='true'] { background: #444; color: #fff; }
      #views { position: absolute; top: 28px; left: 0; right: 0; bottom: 0; }
      webview { position: absolute; inset: 0; visibility: hidden; }
      webview[data-active='true'] { visibility: visible; }
      /* The pane's pointer (apps/desktop/src/styles.css .browser__cursor), in the desktop's primary colour. */
      #cursor { position: absolute; z-index: 3; width: 0; height: 0; pointer-events: none; display: none;
        transition-property: left, top; transition-timing-function: ease-in-out; }
      #cursor svg { position: absolute; left: -2px; top: -2px; overflow: visible; filter: drop-shadow(0 1px 2px rgb(0 0 0 / 35%)); }
      #cursor path { fill: #d62a00; stroke: #fff; stroke-width: 1.6; stroke-linejoin: round; }
      #cursor[data-phase='failed'] path { fill: #d93025; }
      #ring { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%;
        border: 1.5px solid #d62a00; background: rgb(214 42 0 / 16%); opacity: 0; }
      #ring.on { animation: press 350ms ease-out; }
      @keyframes press { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(1.4); } }
    </style>
  </head>
  <body>
    <div id="tabs"></div>
    <div id="views">
      <span id="cursor"><span id="ring"></span><svg viewBox="-2 -2 18 23" width="16" height="20"><path d="M0 0 L0.6 19 L5.6 14.2 L13.8 13.6 Z" /></svg></span>
    </div>
    <script>
      // Mirrors the desktop pane's contract with main: one <webview> per tab, adopted by id, kept mounted.
      const views = new Map();
      // Like the desktop pane: the first view is in front until main says otherwise. A hidden view takes no
      // input at all, so a view adopted after the tab list arrived must still learn whether it is the active one.
      let activeTabId = null;
      const strip = document.getElementById('tabs');
      const container = document.getElementById('views');

      function open(url, requestId) {
        const view = document.createElement('webview');
        view.setAttribute('partition', 'persist:moxxy-browser');
        view.setAttribute('allowpopups', '');
        view.setAttribute('src', url);
        if (views.size === 0 && !container.querySelector('webview')) view.dataset.active = 'true';
        container.append(view);
        view.addEventListener('dom-ready', async () => {
          if (view.dataset.tabId) return;
          const tabId = await window.trial.register(view.getWebContentsId(), requestId);
          view.dataset.tabId = tabId;
          views.set(tabId, view);
          if (activeTabId) view.dataset.active = String(tabId === activeTabId);
        }, { once: true });
      }

      window.trial.on('trial.openTab', ({ requestId, url }) => open(url, requestId));
      // As the desktop pane does: bring the tab forward, give the view a frame to show, focus it, then say so.
      window.trial.on('trial.focusTab', async ({ requestId, tabId }) => {
        if (views.has(tabId)) await window.trial.select(tabId).catch(() => {});
        requestAnimationFrame(() => requestAnimationFrame(() => {
          views.get(tabId)?.focus();
          window.trial.focused(requestId);
        }));
      });
      window.trial.on('trial.tabs', ({ tabs, activeTabId: active }) => {
        activeTabId = active;
        for (const [id, view] of views) view.dataset.active = String(id === activeTabId);
        strip.replaceChildren(...tabs.map((tab) => {
          const button = document.createElement('button');
          button.textContent = `${tab.tabId} ${tab.title || tab.url}`;
          button.dataset.active = String(tab.tabId === activeTabId);
          button.onclick = () => window.trial.select(tab.tabId);
          return button;
        }));
      });

      // The agent's pointer, drawn for the tab in front; a glide is answered once it ends, anything else at once.
      const cursor = document.getElementById('cursor');
      const ring = document.getElementById('ring');
      let pending = null;
      const answer = () => {
        if (pending) window.trial.arrived(pending);
        pending = null;
      };
      cursor.addEventListener('transitionend', answer);
      window.trial.on('trial.cursor', ({ requestId, tabId, cursor: at }) => {
        if (tabId !== activeTabId && activeTabId !== null) return window.trial.arrived(requestId);
        if (!at) return void (cursor.style.display = 'none');
        cursor.style.display = 'block';
        cursor.dataset.phase = at.phase;
        if (at.phase !== 'moving') {
          ring.classList.remove('on');
          void ring.offsetWidth;
          ring.classList.add('on');
          return;
        }
        cursor.style.transitionDuration = `${at.durationMs}ms`;
        cursor.style.left = `${at.x}px`;
        cursor.style.top = `${at.y}px`;
        answer();
        if (at.durationMs > 0) pending = requestId;
        else window.trial.arrived(requestId);
      });

      open(new URLSearchParams(location.search).get('start') || 'about:blank');
    </script>
  </body>
</html>

packages:
  - 'packages/*'
  - 'apps/*'
  - 'tooling/*'

# Centralized dependency versions. Packages reference these with
# "<dep>": "catalog:" so the version is defined once here. pnpm rewrites
# catalog: to the concrete version at publish time.
catalog:
  '@clack/prompts': ^1.7.0
  '@noble/ciphers': ^2.3.0
  '@noble/curves': ^2.3.0
  '@noble/hashes': ^2.2.0
  '@types/node': ^22.10.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/ws': ^8.5.0
  esbuild: ^0.28.2
  ink: ^5.0.0
  react: ^18.3.0
  react-dom: ^18.3.0
  tsup: ^8.0.0
  tsx: ^4.23.12
  typescript: ^5.7.3
  vitest: ^3.2.6
  ws: ^8.21.0
  zod: ^3.25.76

packages:
  - 'packages/*'
  - 'apps/*'
  - 'tooling/*'

# Centralized dependency versions. Packages reference these with
# "<dep>": "catalog:" so the version is defined once here. pnpm rewrites
# catalog: to the concrete version at publish time.
catalog:
  # 1.1+ imports node:util.styleText (added in Node 20.12), while moxxy's
  # published runtime floor is Node 20.10. Keep the last compatible release
  # exact so a lockfile refresh cannot silently raise that minimum again.
  '@clack/prompts': 1.0.1
  '@noble/ciphers': ^2.2.0
  '@noble/curves': ^2.2.0
  '@noble/hashes': ^2.4.0
  '@types/node': ^22.10.0
  '@types/react': ^18.3.0
  '@types/react-dom': ^18.3.0
  '@types/ws': ^8.5.0
  esbuild: ^0.25.0
  ink: ^5.0.0
  react: ^18.3.0
  react-dom: ^18.3.0
  tsup: ^8.0.0
  tsx: ^4.23.12
  typescript: ^6.0.3
  vitest: ^3.2.6
  ws: ^8.21.0
  zod: ^3.25.76

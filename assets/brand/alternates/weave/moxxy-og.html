<style>

  .row { display: flex; align-items: center; gap: 38px; position: relative; }

         color: #A8AEBC; max-width: 26ch; letter-spacing: -.014em; position: relative; }

  .foot { position: absolute; left: 88px; bottom: 58px; display: flex; gap: 30px;
          font: 500 20px ui-monospace, SFMono-Regular, Menlo, monospace;
          color: #767D8D; letter-spacing: .05em; }
  .foot span::before { content: ""; display: inline-block; width: 7px; height: 7px;
          background: #FF4A1E; margin-right: 11px; vertical-align: 2px; }
</style>

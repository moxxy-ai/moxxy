<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="moxxy">
  <title>moxxy</title>
  <defs>
    <!-- One-colour reduction, and a different construction on purpose. The
         two-colour mark lets colour carry the interlace; with a single ink the
         under-strand has to actually break, so each strand is cut at the four
         crossings where the other passes over. Crossings sit at
         128 ± 60(sqrt2 - 1) along each edge. -->
    <mask id="moxxy-mono-a" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <rect x="-34" y="-15" width="68" height="30" fill="#000" transform="translate(152.853 188) rotate(-45)"/>
      <rect x="-34" y="-15" width="68" height="30" fill="#000" transform="translate(68 152.853) rotate(45)"/>
      <rect x="-34" y="-15" width="68" height="30" fill="#000" transform="translate(103.147 68) rotate(-45)"/>
      <rect x="-34" y="-15" width="68" height="30" fill="#000" transform="translate(188 103.147) rotate(45)"/>
    </mask>
    <mask id="moxxy-mono-b" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <rect x="-34" y="-15" width="68" height="30" fill="#000" transform="translate(188 152.853)"/>
      <rect x="-34" y="-15" width="68" height="30" fill="#000" transform="translate(103.147 188) rotate(90)"/>
      <rect x="-34" y="-15" width="68" height="30" fill="#000" transform="translate(68 103.147)"/>
      <rect x="-34" y="-15" width="68" height="30" fill="#000" transform="translate(152.853 68) rotate(90)"/>
    </mask>
  </defs>
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round">
    <g mask="url(#moxxy-mono-a)"><rect x="68" y="68" width="120" height="120" rx="12"/></g>
    <g mask="url(#moxxy-mono-b)"><g transform="rotate(45 128 128)"><rect x="68" y="68" width="120" height="120" rx="12"/></g></g>
  </g>
</svg>
